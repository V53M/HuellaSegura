# Entorno local. Puerto 5433 para no chocar con un PostgreSQL instalado en el equipo.
# Traccar se agrega en una versión posterior; por ahora el simulador envía al endpoint directo de la API.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: huellasegura
      POSTGRES_USER: huellasegura
      POSTGRES_PASSWORD: huellasegura_local
    ports:
      - "5433:5432"
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huellasegura -d huellasegura"]
      interval: 3s
      retries: 20

volumes:
  datos_pg:
